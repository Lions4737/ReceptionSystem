name: Deploy production Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: c0aa39667f328632eae2c2c42d51564f
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check deployment credential
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Set the CLOUDFLARE_API_TOKEN repository secret (Cloudflare Pages Edit and D1 Edit for the production account).'
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - name: Build and package Pages
        run: npm run build:pages
      - name: Apply production migrations
        run: npx wrangler d1 migrations apply utpoker-festival-reception --remote --config wrangler.pages.jsonc
      - name: Deploy main to the existing Pages project
        run: npx wrangler pages deploy --cwd dist/pages --project-name utpoker-festival-reception --branch main --commit-hash "$GITHUB_SHA"
